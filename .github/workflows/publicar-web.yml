name: Publicar web

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/publicar-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
