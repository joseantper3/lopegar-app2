<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="App del conductor de Lopegar Express S.L.U.: gasolineras, Plenergy, rutas TIPSA, DeCA, tráfico, clima, radares y radio.">
<meta name="theme-color" content="#25272b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOPEGAR EXPRESS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>LOPEGAR EXPRESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8f8f7}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: app de cabina — cabecera grafito con el arco naranja del logo, navegación lateral en escritorio y barra inferior en móvil, cada sección es una vista */
:root{
  --bg:#eceeef; --panel:#ffffff; --ink:#1c1e21; --muted:#5f656c; --line:#d6d9dc;
  --brand:#e8571a; --brand-2:#c94512; --brand-ink:#ffffff; --brand-soft:#fde9df;
  --char:#25272b; --char-ink:#f2f3f4; --char-muted:#a7abb0;
  --ok:#1e7a4c; --warn:#a85410; --sos:#c62828;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214;--panel:#1a1c1f;--ink:#eceef0;--muted:#9ca2a8;--line:#2b2e33;
  --brand:#ff6a2b;--brand-2:#ff8a57;--brand-ink:#1a0c05;--brand-soft:#3a1d10;
  --char:#0b0c0d;--char-ink:#f2f3f4;--char-muted:#9ca2a8;--ok:#4cc38a;--warn:#f0a35a;--sos:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214;--panel:#1a1c1f;--ink:#eceef0;--muted:#9ca2a8;--line:#2b2e33;
  --brand:#ff6a2b;--brand-2:#ff8a57;--brand-ink:#1a0c05;--brand-soft:#3a1d10;
  --char:#0b0c0d;--char-ink:#f2f3f4;--char-muted:#9ca2a8;--ok:#4cc38a;--warn:#f0a35a;--sos:#ff6b6b;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.d{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Estructura */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{background:var(--char);color:var(--char-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1240px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:50%;flex:none;background:#e8e8e8;overflow:hidden;display:block}
.logo img{width:100%;height:100%;display:block}
.brandtxt{min-width:0;flex:1;text-decoration:none}
.brandtxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brandtxt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--char-muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-display);font-weight:600;margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--char-ink);text-decoration:none}
.iconbtn:hover{border-color:var(--brand)}
.iconbtn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.shell{max-width:1240px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr;gap:0}
.side{display:none}
main{padding:20px 16px 110px;min-width:0}
@media (min-width:900px){
  .shell{grid-template-columns:236px 1fr;gap:8px}
  .side{display:block;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;padding:20px 0 20px 16px}
  .side nav{display:grid;gap:2px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:16px}
  .side a svg{width:20px;height:20px}
  .side a:hover{color:var(--ink);background:var(--panel)}
  .side a.on{color:var(--ink);background:var(--panel);box-shadow:inset 3px 0 0 var(--brand)}
  .side .sep{height:1px;background:var(--line);margin:10px 12px}
  .bottom{display:none!important}
  main{padding:24px 16px 56px}
}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.bottom a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 2px;border-radius:10px}
.bottom a svg{width:22px;height:22px}
.bottom a.on{color:var(--brand)}
.bottom a.sos{color:var(--sos)}

/* Cabecera de vista */
.vh{display:grid;gap:6px;margin-bottom:18px}
.vh .eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--brand)}
h1,h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px);line-height:.95}
h2{font-size:24px;line-height:1.05}
.vh p{margin:0;color:var(--muted);max-width:60ch}

/* Inicio */
.hero{position:relative;overflow:hidden;background:var(--char);color:var(--char-ink);border-radius:18px;padding:26px 22px;margin-bottom:16px}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-150px;border-radius:50%;border:26px solid var(--brand);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg);opacity:.95}
.hero::after{content:"";position:absolute;width:250px;height:250px;right:-60px;top:-90px;border-radius:50%;border:8px solid #6b6e73;border-right-color:transparent;border-top-color:transparent;transform:rotate(-20deg)}
.hero > *{position:relative;z-index:1}
.hero .hi{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--char-muted)}
.hero h1{font-size:clamp(38px,7vw,64px);margin:6px 0 8px;max-width:12ch}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:0;max-width:44ch;color:#d5d7da}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px}

.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);border:1px solid var(--brand);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.aviso svg{width:22px;height:22px;flex:none;color:var(--brand);margin-top:2px}
.aviso b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;display:block;font-size:14px;color:var(--brand-2)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{display:grid;gap:10px;align-content:space-between;min-height:128px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.tile .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:19px;letter-spacing:.03em;line-height:1.05}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tile.sos .ic{background:var(--sos);color:#fff}

.sosbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sos);border-radius:var(--r);padding:14px 16px}
.sosbar b{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--muted);display:block}
.sosbar .mono{font-size:22px}

/* Componentes */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--char);color:var(--char-ink);font-family:var(--f-mono);font-size:13px}
.item .t{min-width:0}
.item .t b{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.item .t span{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;background:var(--brand);color:var(--brand-ink);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:var(--brand);color:var(--brand-ink)}
.btn:hover{background:var(--brand-2)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);background:transparent}
.btn.dark{background:var(--char);color:var(--char-ink)}
.btn.danger{background:transparent;color:var(--sos);border-color:var(--line)}
.btn.sm{font-size:12px;padding:6px 10px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--char);color:var(--char-ink);border-color:var(--char)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:22px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.pad{padding:18px}
.stack{display:grid;gap:12px}

.phone{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;flex-wrap:wrap}
.phone .lbl{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.phone .lbl small{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--muted)}
.phone .n{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums;user-select:all}
.phone .acts{display:flex;gap:6px}
.emerg{background:var(--sos);color:#fff;border-color:transparent}
.emerg .lbl small{color:#fff;opacity:.85}
.insurer{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.insurer b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--sos)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}

dl.kv{margin:0;display:grid}
.kv > div{display:grid;grid-template-columns:minmax(100px,160px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.kv > div:first-child{border-top:0}
.kv dt{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:15px;min-width:0;overflow-wrap:anywhere;user-select:all}
@media (max-width:560px){.kv > div{grid-template-columns:minmax(0,1fr) auto}.kv dt{grid-column:1/-1}}

.iconbtn.mic.on{background:var(--sos);border-color:var(--sos);color:#fff;animation:micp 1.6s infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}70%{box-shadow:0 0 0 10px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
body.voice .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){body.voice .toast{bottom:84px}}
@media (max-width:420px){.brandtxt b{font-size:19px}.top-in{gap:8px}.iconbtn{width:40px;height:40px}}
.radctl{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap;margin-bottom:12px}
.radctl .rci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);flex:none}
.radctl.on{border-color:var(--ok)}.radctl.on .rci{background:var(--ok);color:#fff}
.radctl .rci svg{width:24px;height:24px}
.rct{flex:1;min-width:180px}.rct b{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:18px}
.rct span{font-size:13px;color:var(--muted)}
.radnear{padding:14px 16px;margin-bottom:12px;display:grid;gap:2px;border-left:4px solid var(--ok)}
.radnear.hot{border-left-color:var(--sos)}
.radnear .d{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.radnear b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.radnear.hot b{color:var(--sos)}
.radnear > span:last-child{font-size:14px}
.sel{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.num.rt0{background:#1f4e9c;color:#fff}.num.rt1{background:var(--brand);color:var(--brand-ink)}
.rkm{font-family:var(--f-body);font-weight:500;text-transform:none;font-size:14px;color:var(--muted);letter-spacing:0}
b.hot{color:var(--sos)}
.radchip{color:#7be0a6!important;border-color:#2f7a52!important}
.radchip.alert{background:var(--sos);border-color:var(--sos)!important;color:#fff!important;animation:micp 1.2s infinite}
.radbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:35;display:flex;align-items:center;gap:12px;background:var(--sos);color:#fff;text-decoration:none;border-radius:16px;padding:10px 16px 10px 10px;width:min(520px,calc(100% - 24px));box-shadow:0 10px 30px rgba(0,0,0,.35)}
.radbar .rbi{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;animation:pulse 1s infinite}
.radbar .rbi svg{width:28px;height:28px}
.rbt{display:grid;min-width:0}.rbt small{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;opacity:.9}
.rbt b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.rbt span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 18px;margin-bottom:12px}
.share > div:last-child{flex:1;min-width:220px;display:grid;gap:6px}
.share b.d{font-weight:800;font-size:20px}
.share p{margin:0;font-size:14px;color:var(--muted)}
.qrbox{width:150px;height:150px;flex:none;background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center;border:1px solid var(--line)}
.qrbox svg{width:100%;height:100%}
.qrbox.empty{background:var(--bg);color:var(--muted)}.qrbox.empty svg{width:40px;height:40px}
.qurl{font-size:13px!important;color:var(--ink)!important;overflow-wrap:anywhere}
.aviso.offl{background:var(--panel);border-color:var(--line)}
.aviso.offl b{color:var(--ink)}
.msheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.55);display:grid;place-items:center;padding:16px}
.msheet{max-width:440px;width:100%;padding:22px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.msheet h2{font-size:24px}
.msheet p{margin:0;font-size:15px}
.mic-ic{width:52px;height:52px;border-radius:50%;background:var(--sos);color:#fff;display:grid;place-items:center}
.mic-ic svg{width:26px;height:26px}
.msh-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.install{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px;padding:14px 16px;border:1px solid var(--brand)}
.install b.in{font-family:inherit;text-transform:none;font-size:inherit;display:inline;font-weight:700;color:var(--ink)}
.msheet .shr,.install .shr{width:16px;height:16px;vertical-align:-3px;color:var(--brand)}
.install > div{flex:1;min-width:200px}
.install b{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:17px;display:block}
.install span{font-size:13px;color:var(--muted)}
.vbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:10px;background:var(--char);color:var(--char-ink);border:1px solid var(--sos);border-radius:999px;padding:8px 8px 8px 16px;width:min(560px,calc(100% - 32px));box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media (min-width:900px){.vbar{bottom:24px}}
.vbar .vt{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar[data-st="ok"]{border-color:var(--ok)}
.vbar[data-st="no"],.vbar[data-st="err"]{border-color:var(--brand)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--sos);flex:none;animation:pulse 1.2s infinite}
.vbar[data-st="ok"] .vdot{background:var(--ok)}
.vhelp,.vclose{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--char-ink);cursor:pointer;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:17px}
.vclose svg{width:16px;height:16px}
.vhelpbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:26;width:min(560px,calc(100% - 32px));padding:14px 16px;max-height:60vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
@media (min-width:900px){.vhelpbox{bottom:84px}}
.vhh{display:flex;align-items:center;justify-content:space-between}
.vhh b{font-weight:800;font-size:18px}

.dk-acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dk-acts .btn{min-height:46px;white-space:normal}
.btn.danger.armed{background:var(--sos);color:#fff;border-color:var(--sos)}
.dk-view{margin-top:14px;display:grid;gap:10px}
.dk-view img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--char);color:var(--char-ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;border:1px solid var(--brand)}
foot,footer{display:block}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

la cabina", "riesgo": "Las caídas desde la cabina o la caja están entre los accidentes más frecuentes del conductor: esguinces, fracturas y golpes.", "ejemplo": "Llegas a la agencia y bajas de un salto con el móvil en la mano. El peldaño está mojado, el pie resbala y te tuerces el tobillo. Sin apoyo de las manos, todo el peso cae sobre una sola pierna.", "medidas": "Usa siempre tres puntos de apoyo: dos manos y un pie, o dos pies y una mano.\nBaja de cara a la cabina, nunca de espaldas ni saltando.\nLleva las manos libres: deja el móvil y los albaranes antes de bajar.\nUsa calzado de seguridad con suela antideslizante.\nMantén limpios los peldaños y los asideros."}, {"titulo": "Carga y descarga en muelles", "riesgo": "Atropellos por carretillas, atrapamientos con la plataforma del muelle y desplazamientos del camión durante la carga.", "ejemplo": "Mientras la carretilla entra en el remolque, te quedas entre el camión y el muelle revisando el albarán. El camión no tiene calzos y se desplaza unos centímetros: el hueco que se abre puede volcar la carretilla o atraparte.", "medidas": "Antes de cargar: freno de estacionamiento, motor apagado y calzos puestos.\nNo te quedes en la zona de paso de carretillas ni entre el camión y el muelle.\nPonte el chaleco reflectante en las instalaciones del cliente.\nRespeta las normas de la nave y los pasillos peatonales señalizados.\nSi la instalación usa bloqueo de llaves o semáforo de muelle, síguelo siempre."}, {"titulo": "Manipulación manual de cargas", "riesgo": "Lesiones de espalda, hombros y muñecas al levantar, empujar o girar con peso, sobre todo en reparto de paquetería.", "ejemplo": "En una entrega de varias cajas te agachas doblando la espalda y giras el tronco para dejarlas en la transpaleta. Repetido decenas de veces al día, es el origen típico de la lumbalgia.", "medidas": "Dobla las rodillas, espalda recta y la carga pegada al cuerpo.\nNo gires el tronco con peso: mueve los pies.\nUsa transpaleta o carretilla de mano siempre que puedas.\nComo referencia, no levantes solo más de 25 kg; pide ayuda con bultos pesados o voluminosos.\nUsa guantes para cantos, flejes y astillas."}, {"titulo": "Sujeción y estiba de la carga", "riesgo": "Una carga mal sujeta se mueve en frenadas y curvas, desestabiliza el vehículo y puede caer al abrir las puertas.", "ejemplo": "Un palé de bebidas sin cinchar se desplaza en una rotonda y queda apoyado contra las puertas traseras. Al abrirlas en destino, la mercancía cae sobre ti.", "medidas": "Reparte el peso de forma equilibrada y lo más pegado posible al frontal.\nSujeta con cinchas, barras o redes adecuadas al tipo de carga.\nRevisa la sujeción tras los primeros kilómetros y después de cada parada de reparto.\nAbre las puertas despacio y apartado, por si algo se ha movido.\nNo superes la masa máxima autorizada."}, {"titulo": "Ángulos muertos y marcha atrás", "riesgo": "Desde la cabina hay zonas que no se ven, sobre todo junto al lateral derecho, delante del frontal y detrás del vehículo.", "ejemplo": "En una calle estrecha de reparto giras a la derecha. Un ciclista se ha colocado junto a la rueda delantera derecha y no aparece en ningún espejo.", "medidas": "Ajusta todos los espejos antes de salir, también el de bordillo y el delantero.\nGira despacio y vuelve a mirar los espejos durante todo el giro.\nMarcha atrás solo con ayudante o bajando antes a comprobar la zona.\nSi no ves, no te muevas."}, {"titulo": "Distracciones y móvil", "riesgo": "Mirar el móvil 2 segundos a 90 km/h supone recorrer 50 metros a ciegas.", "ejemplo": "Te llega la dirección de la próxima entrega y la escribes en el navegador sin parar. Justo en ese momento, el tráfico de delante frena en seco.", "medidas": "Programa el navegador antes de arrancar.\nUsa solo manos libres y llamadas breves; mejor, para a contestar.\nNo escribas ni leas mensajes conduciendo.\nOrdena la cabina para que nada se caiga ni tengas que buscarlo en marcha."}, {"titulo": "Avería o accidente en la vía", "riesgo": "Bajarse en la calzada es una de las situaciones con más riesgo de atropello para el conductor.", "ejemplo": "Pinchas de noche en el arcén de la autovía. Bajas por el lado izquierdo para mirar la rueda, sin chaleco, con los coches pasando a un metro.", "medidas": "Apártate lo máximo posible y enciende las luces de emergencia.\nPonte el chaleco antes de bajar y sal por el lado contrario al tráfico si puedes.\nColoca la baliza V-16 en el techo.\nEspera detrás del guardarraíl, nunca delante del vehículo ni en la calzada.\nSi hay un accidente: Proteger, Avisar al 112 y Socorrer (P.A.S.)."}, {"titulo": "Calor, frío y salud", "riesgo": "El sedentarismo, la mala alimentación y los cambios de temperatura pasan factura a medio y largo plazo.", "ejemplo": "En verano, descargando a mediodía en un polígono de Sevilla, llevas toda la mañana sin beber. El mareo y el dolor de cabeza son los primeros avisos de un golpe de calor.", "medidas": "Bebe agua con frecuencia, aunque no tengas sed.\nEn verano, deja las tareas físicas para las horas de menos calor cuando sea posible.\nHaz comidas ligeras y regulares; evita picar en ruta.\nAprovecha las pausas para caminar y estirar.\nAcude a los reconocimientos médicos que ofrece la empresa."}], "recursos": [{"titulo": "Carga y descarga en el transporte de mercancías por carretera", "fuente": "INSST", "tipo": "Vídeo", "tema": "Carga y descarga", "url": "https://www.youtube.com/watch?v=3umLknWbKcw"}, {"titulo": "Trabajos seguros en el transporte de mercancías por carretera", "fuente": "INSST", "tipo": "Vídeo", "tema": "Trabajo seguro", "url": "https://www.youtube.com/watch?v=Zs3zEej5Z0U"}, {"titulo": "Napo en… el camino hacia la seguridad", "fuente": "EU-OSHA", "tipo": "Vídeo", "tema": "Conducción profesional · animación sin diálogos", "url": "https://www.napofilm.net/es/napos-films/napo-road-safety"}, {"titulo": "Napo en… moverse seguro", "fuente": "EU-OSHA", "tipo": "Vídeo", "tema": "Vehículos, cargas y maniobras · animación sin di  const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}

async function dkDecode(cv){
 if("BarcodeDetector" in window){try{const r=await new BarcodeDetector({formats:["qr_code"]}).detect(cv);if(r&&r.length)return r[0].rawValue}catch(e){}}
 try{await dkLoad(DK_JSQR)}catch(e){return null}
 for(const mx of [1600,1100,800]){const big=Math.max(cv.width,cv.height);const c=big>mx?dkCanvas(cv,mx):cv;const x=c.getContext("2d",{willReadFrequently:true});
  const r=window.jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});if(r&&r.data)return r.data;if(big<=mx)break}

 const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:vp}).promise;return c}

/* almacén en el móvil (IndexedDB) */
function dkIdb(){if(DK.idb)return DK.idb;DK.idb=new Promise((ok,ko)=>{try{const r=indexedDB.open("lopegar-deca",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("recs",{keyPath:"id"});d.createObjectStore("files")};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});return DK.idb}
async function dkTx(store,mode,fn){const d=await dkIdb();return new Promise((ok,ko)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const req=fn(s);t.oncomplete=()=>ok(req&&req.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})}
/* arranque */
async function dkInit(){
 if(DK.mode)return;DK.mode="init";
 if(window.claude&&window.claude.use){
  const [db,user,dl]=await Promise.all(["db","user","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  DK.dl=dl;DK.user=user;
  if(db){DK.db=db;DK.mode="cloud";
   try{DK.me=user?await user.me():null;DK.canEdit=!!(DK.me&&DK.me.canEdit)}catch(e){}
   if(!DK.me||!DK.me.id)DK.filter="all";
   db.collection("deca").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>{DK.recs=s.docs.map(d=>({id:d.id,...d.data()}));dkRefresh()},()=>{DK.err=true;dkRefresh()});
   if(view==="deca")render();return}
 }
 DK.mode="local";
 try{DK.recs=(await dkTx("recs","readonly",s=>s.getAll()))||[]}catch(e){DK.err=true}
 if(view==="deca")render();
}
function dkRefresh(){if(view==="deca"&&!DK.busy&&DK.tab==="docs")render();if(DK.open)dkSheet(DK.open)}
/* vista */

 return vh("Documento de control","DeCA","Sube el DeCA de cada servicio antes de salir y enséñalo con su código QR si te paran en una inspección.")+
 `<div class="tools"><div class="chips" role="tablist"><button type="button" class="chip" aria-pressed="${DK.tab==="subir"}" data-dk="tab:subir">Subir DeCA</button><button type="button" class="chip" aria-pressed="${DK.tab==="docs"}" data-dk="tab:docs">Mis documentos${n?` · ${n}`:""}</button></div></div>
 ${DK.mode==="init"||!DK.mode?`<p class="note">Preparando…</p>`:DK.tab==="subir"?dkUpload():dkDocs()}`;
}

 </div>
 <div class="card dk-step"><div class="dk-sh"><span>2</span><b>QR del DeCA</b></div>${qr}

 </form></div>
 <p class="note" style="margin-top:12px">El documento con validez ante la Inspección es el que emite el cargador o la empresa con su propio código QR; aquí se archiva y se asocia a cada vehículo y servicio.</p>`;

function dkDocs(){
 const q=DK.q.trim().toLowerCase(),qp=dkNorm(DK.q);
 let rows=DK.recs.filter(r=>DK.mode!=="cloud"||DK.filter==="all"||!DK.me||!DK.me.id||r.driver===DK.me.id);
 if(q)rows=rows.filter(r=>(qp&&dkNorm(r.plate).includes(qp))||[r.ref,r.origin,r.dest,r.qrUrl,r.notes].some(v=>String(v||"").toLowerCase().includes(q)));
 const sorted=rows.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""));
 let html="",cur=null,grp=[];const flush=()=>{if(cur!==null)html+=`<div class="dk-gh"><span>${esc(dkDay(cur))}</span><span>${grp.length}</span></div><div class="dk-list">${grp.join("")}</div>`};
 for(const r of sorted){if(r.date!==cur){flush();cur=r.date;grp=[]}
  const route=[r.origin,r.dest].filter(Boolean).join(" → ");
  grp.push(`<button type="button" class="card dk-item" data-dk="open:${esc(r.id)}"><span class="l1">${dkPlate(r.plate)}${r.qrUrl?`<span class="dk-pill ok">QR oficial</span>`:`<span class="dk-pill warn">Sin QR</span>`}</span><b>${esc(route||r.ref||"DeCA")}</b><span class="note">${r.ref&&route?esc(r.ref)+" · ":""}Subido ${esc(dkStamp(r.createdAt))}</span></button>`)}
 flush();
 return `<div class="tools"><div class="search">${ic("search")}<input type="search" id="dkQ" value="${esc(DK.q)}" placeholder="Buscar matrícula, albarán, ciudad…" aria-label="Buscar DeCA"></div><label class="btn ghost" for="dkFind">Buscar por QR</label><input class="dk-sr" type="file" id="dkFind" accept="image/*" capture="environment"></div>
 ${DK.mode==="cloud"?`<div class="chips" style="margin-bottom:12px"><button type="button" class="chip" aria-pressed="${DK.filter==="mine"}" data-dk="flt:mine">Mis documentos</button><button type="button" class="chip" aria-pressed="${DK.filter==="all"}" data-dk="flt:all">Toda la flota</button></div>`:""}
 ${DK.err?`<div class="card empty">No se han podido cargar los documentos. Vuelve a abrir la app.</div>`
  :html||`<div class="card empty">${q?`Nada coincide con «${esc(DK.q)}».`:`Aún no hay DeCA guardados. Pulsa «Subir DeCA», haz una foto del documento o elige el PDF.`}</div>`}
 <p class="note" style="margin-top:12px">${dkWhere()}</p>`;
}
/* subir documento */
async function dkPick(file){
 if(!file)return;
 const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name),isImg=/^image\//.test(file.type);
 if(!isPdf&&!isImg){toast("Ese archivo no es un PDF ni una imagen.");return}
 const p={name:file.name||(isPdf?"deca.pdf":"deca.jpg"),isPdf,pages:[],info:""};DK.pending=p;DK.qrState="busy";render();
 try{let found=null;
  if(isPdf){
   const bytes=new Uint8Array(await file.arrayBuffer());p.orig=new Blob([bytes],{type:"application/pdf"});
   const lib=await dkPdf();const pdf=await lib.getDocument({data:bytes.slice()}).promise;const n=Math.min(pdf.numPages,4);
   for(let i=1;i<=n;i++){const cv=await dkPdfPage(pdf,i,1700);p.pages.push(await dkSmall(cv));if(i===1)p.thumb=cv.toDataURL("image/jpeg",.6);
    if(!found&&i<=3)found=(await dkDecode(cv))||(await dkDecode(await dkPdfPage(pdf,i,2600)))}
   p.info=`PDF · ${pdf.numPages} ${pdf.numPages===1?"página":"páginas"} · ${dkKb(p.orig.size)}`;
  }else{
   const u=URL.createObjectURL(file);const img=await dkImg(u);URL.revokeObjectURL(u);const cv=dkCanvas(img,2000);
   p.pages.push(await dkSmall(cv));p.orig=await dkBlob(cv,.85);p.name=p.name.replace(/\.[a-z0-9]+$/i,"")+".jpg";p.thumb=cv.toDataURL("image/jpeg",.6);
   found=await dkDecode(dkCanvas(img,2600));p.info="Foto · "+dkKb(p.orig.size);
  }
  if(DK.pending!==p)return;
  if(found)DK.qr=found;DK.qrState=DK.qr?"found":"none";
 }catch(e){console.error(e);if(DK.pending!==p)return;p.info="No se ha podido leer el archivo. Prueba con otro o haz una foto.";p.bad=true;DK.qrState=DK.qr?"found":"none"}
 render();
}
async function dkSave(){
 const p=DK.pending,f=DK.f;
 if(!p||p.bad||!p.pages.length){toast("Primero sube el documento (paso 1).");return}
 const plate=dkNorm(f.plate);if(plate.length<4){toast("Escribe la matrícula del vehículo.");const el=$("#dk-plate");el&&el.focus();return}
 DK.busy=true;render();
 const id=dkId(),qrUrl=DK.qr.trim();
 const rec={plate,date:f.date||dkToday(),ref:f.ref.trim(),origin:f.from.trim(),dest:f.to.trim(),notes:f.notes.trim(),qrUrl,qrSvg:await dkQrSvg(qrUrl),
  createdAt:new Date().toISOString(),file:{name:p.name,type:p.isPdf?"application/pdf":"image/jpeg",size:p.orig?p.orig.size:0,pages:p.pages.length}};
 try{
  if(DK.mode==="cloud"){
   rec.driver=DK.me&&DK.me.id||null;
   for(let i=0;i<p.pages.length;i++)await DK.db.doc("deca_files/"+id+"_p"+i).set({data:await dkB64(p.pages[i]),type:"image/jpeg"});
   if(p.orig&&p.orig.size<=DK_INLINE){await DK.db.doc("deca_files/"+id+"_o").set({data:await dkB64(p.orig),type:p.orig.type});rec.file.orig=true}
   await DK.db.doc("deca/"+id).set(rec);
  }else{
   rec.file.orig=!!p.orig;
   await dkTx("files","readwrite",s=>s.put({pages:p.pages,orig:p.orig||null},id));
   await dkTx("recs","readwrite",s=>s.put({id,...rec}));
  }
  if(!DK.recs.some(r=>r.id===id))DK.recs=[{id,...rec},...DK.recs];
  ls.set("lgx-dk-plate",dkPlateFmt(plate));
  DK.f={plate:dkPlateFmt(plate),date:dkToday(),ref:"",from:"",to:"",notes:""};DK.pending=null;DK.qr="";DK.qrState="idle";
  DK.busy=false;DK.tab="docs";ls.set("lgx-dk-tab","docs");render();toast("DeCA guardado");dkSheet(id);
 }catch(e){console.error(e);DK.busy=false;render();
  const c=e&&e.code;toast(c==="invalid_argument"||c==="not_granted"?"Tu acceso no permite guardar: pide al responsable acceso de Colaborador.":c==="quota_exceeded"||c==="resource_exhausted"?"Se ha llenado el espacio de la app. Avisa al responsable.":"No se ha podido guardar. Vuelve a intentarlo.")}
}
async function dkPages(r){
 if(DK.mode==="cloud"){const out=[];for(let i=0;i<(r.file&&r.file.pages||1);i++){const s=await DK.db.doc("deca_files/"+r.id+"_p"+i).get();if(s.exists){const d=s.data();out.push(dkFromB64(d.data,d.type))}}return out}
 const f=await dkTx("files","readonly",s=>s.get(r.id));return f&&f.pages||[];
}
async function dkOrig(r){
 if(DK.mode==="cloud"){if(r.file&&r.file.orig){const s=await DK.db.doc("deca_files/"+r.id+"_o").get();if(s.exists){const d=s.data();return dkFromB64(d.data,d.type)}}return null}
 const f=await dkTx("files","readonly",s=>s.get(r.id));return f&&f.orig||null;
}
/* hoja de detalle (fuera del contenido para que no se cierre al refrescar) */
async function dkSheet(id){
 const r=DK.recs.find(x=>x.id===id);let el=document.getElementById("dkSheet");
 if(!r){el&&el.remove();DK.open=null;return}
 const first=!el||DK.open!==id;DK.open=id;
 if(!el){el=document.createElement("div");el.id="dkSheet";el.className="dk-sheet";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);document.body.style.overflow="hidden"}
 const mine=DK.mode!=="cloud"||(DK.me&&DK.me.id&&r.driver===DK.me.id);const canDel=mine||DK.canEdit;
 let who="";if(DK.mode==="cloud"&&r.driver&&DK.user){try{const ps=await DK.user.profiles([r.driver]);who=(ps[r.driver]&&ps[r.driver].name)||"Conductor"}catch(e){who="Conductor"}}
 const route=[r.origin,r.dest].filter(Boolean).join(" → ");
 const keepView=!first&&el.querySelector("#dkView")?el.querySelector("#dkView").innerHTML:"";
 el.innerHTML=`<div class="dk-shh"><button type="button" class="btn ghost sm" data-dk="close">← Volver</button><b>${esc(dkPlateFmt(r.plate))}${r.ref?" · "+esc(r.ref):""}</b></div>
 <div class="dk-shb">
  <div class="card dk-hero">${r.qrUrl?`<span class="dk-pill ok">QR oficial del DeCA</span><div class="dk-qrbig">${r.qrSvg||""}</div><b>Enseña este QR en la inspección</b><p class="dk-url">${esc(r.qrUrl)}</p>`
   :`<span class="dk-pill warn">Sin QR oficial</span><p class="note">El documento no tenía un QR legible. Si lo tiene, pulsa «Asociar QR» y fotografíalo de cerca.</p>`}</div>
  <dl class="dk-facts"><dt>Matrícula</dt><dd>${dkPlate(r.plate)}</dd><dt>Servicio</dt><dd>${esc(dkDate(r.date))}</dd>${r.ref?`<dt>Referencia</dt><dd>${esc(r.ref)}</dd>`:""}${route?`<dt>Ruta</dt><dd>${esc(route)}</dd>`:""}${who?`<dt>Conductor</dt><dd>${esc(who)}</dd>`:""}
   <dt>Subido</dt><dd>${esc(dkStamp(r.createdAt))}</dd><dt>Archivo</dt><dd>${esc((r.file&&r.file.type==="application/pdf"?"PDF":"Foto")+(r.file&&r.file.size?" · "+dkKb(r.file.size):""))}</dd>${r.notes?`<dt>Notas</dt><dd>${esc(r.notes)}</dd>`:""}</dl>
  <div class="dk-acts"><button type="button" class="btn" data-dk="view">Ver documento</button>
   ${r.qrUrl&&/^https?:\/\//i.test(r.qrUrl)?`<a class="btn ghost" href="${esc(r.qrUrl)}" target="_blank" rel="noopener">Abrir enlace oficial</a>`:""}
   <button type="button" class="btn ghost" data-dk="dl">Descargar</button>
   ${mine||DK.canEdit?`<label class="btn ghost" for="dkAssoc">Asociar QR</label><input class="dk-sr" type="file" id="dkAssoc" accept="image/*" capture="environment">`:""}
   ${canDel?`<button type="button" class="btn danger" data-dk="del">Eliminar</button>`:""}</div>
  <div id="dkView" class="dk-view">${keepView}</div>
 </div>`;
 if(first)el.scrollTop=0;
}
function dkClose(){const el=document.getElementById("dkSheet");el&&el.remove();DK.open=null;DK.armed=false;document.body.style.overflow=""}
async function dkView(r){
 const v=$("#dkView");if(!v)return;v.innerHTML=`<span class="dk-pill busy"><span class="spin"></span>Abriendo documento…</span>`;
 try{const ps=await dkPages(r);if(!ps.length)throw new Error("vacío");v.innerHTML="";
  ps.forEach((b,i)=>{const img=new Image();img.alt=`DeCA ${dkPlateFmt(r.plate)}, página ${i+1}`;img.src=URL.createObjectURL(b);v.appendChild(img)});
  if(r.file&&r.file.type==="application/pdf")v.insertAdjacentHTML("beforeend",`<p class="note">Vista del PDF${r.file.pages>=4?" (primeras 4 páginas)":""}. «Descargar» guarda el archivo original${r.file.orig?"":" (en la flota se guarda como imagen si el PDF es grande)"}.</p>`);
 }catch(e){v.innerHTML=`<div class="card empty">No se ha podido abrir el documento. Comprueba la conexión o vuelve a subirlo.</div>`}
}
async function dkDownload(r){
 try{let b=await dkOrig(r),ext=b&&b.type==="application/pdf"?"pdf":"jpg";if(!b){b=(await dkPages(r))[0];ext="jpg"}if(!b)throw new Error("vacío");
  const name=`DeCA_${dkNorm(r.plate)}_${r.date||""}${r.ref?"_"+r.ref.replace(/[^\w-]+/g,""):""}.${ext}`;
  if(DK.dl){await DK.dl.save({filename:name,data:b});toast("Descarga lista");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
 }catch(e){if(!(e&&e.code==="declined"))toast("No se ha podido descargar.")}
}
async function dkDelete(r){
 try{if(DK.mode==="cloud"){for(let i=0;i<(r.file&&r.file.pages||1);i++){try{await DK.db.doc("deca_files/"+r.id+"_p"+i).delete()}catch(e){}}if(r.file&&r.file.orig){try{await DK.db.doc("deca_files/"+r.id+"_o").delete()}catch(e){}}await DK.db.doc("deca/"+r.id).delete()}
  else{await dkTx("files","readwrite",s=>s.delete(r.id));await dkTx("recs","readwrite",s=>s.delete(r.id))}
  DK.recs=DK.recs.filter(x=>x.id!==r.id);dkClose();render();toast("DeCA eliminado");
 }catch(e){toast("No se ha podido eliminar.")}
}
async function dkAssoc(r,file){
 toast("Leyendo QR…");const t=await dkDecodeFile(file).catch(()=>null);
 if(!t){toast("No se ha podido leer el QR. Acércate más y evita reflejos.");return}
 const upd={qrUrl:t,qrSvg:await dkQrSvg(t)};
 try{if(DK.mode==="cloud")await DK.db.doc("deca/"+r.id).update(upd);else await dkTx("recs","readwrite",s=>s.put({...r,...upd}));
  Object.assign(r,upd);toast("QR asociado");dkSheet(r.id)}catch(e){toast("No se ha podido guardar el QR.")}
}
/* eventos */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-dk]");if(!b)return;const [a,arg]=b.dataset.dk.split(/:(.*)/);
 if(a==="tab"){DK.tab=arg;ls.set("lgx-dk-tab",arg);render();return}
 if(a==="flt"){DK.filter=arg;render();return}
 if(a==="change"){DK.pending=null;DK.qr="";DK.qrState="idle";render();return}
 if(a==="open"){dkSheet(arg);return}
 if(a==="close"){dkClose();return}
 const r=DK.recs.find(x=>x.id===DK.open);if(!r)return;
 if(a==="view")dkView(r);
 else if(a==="dl")dkDownload(r);
 else if(a==="del"){if(!DK.armed){DK.armed=true;b.classList.add("armed");b.textContent="Pulsa otra vez para eliminar";setTimeout(()=>{DK.armed=false;if(b.isConnected){b.classList.remove("armed");b.textContent="Eliminar"}},4000);return}DK.armed=false;dkDelete(r)}
});
document.addEventListener("input",e=>{
 const id=e.target.id||"";
 if(id.startsWith("dk-")){DK.f[id.slice(3)]=e.target.value;return}
 if(id==="dkQ"){DK.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#dkQ");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener("change",async e=>{
 const t=e.target,id=t.id||"",f=t.files&&t.files[0];
 if(id==="dkQr"){DK.qr=t.value.trim();DK.qrState=DK.qr?"found":(DK.pending?"none":"idle");render();return}
 if(id==="dk-plate"){const v=dkPlateFmt(t.value);if(v){t.value=v;DK.f.plate=v}return}
 if(!f)return;t.value="";
 if(id==="dkCam"||id==="dkFile"){dkPick(f);return}
 if(id==="dkQrCam"){DK.qrState="busy";render();const q=await dkDecodeFile(f).catch(()=>null);if(q){DK.qr=q;DK.qrState="found";toast("QR leído")}else{DK.qrState=DK.qr?"found":"none";toast("No se ha podido leer el QR. Acércate más y evita reflejos.")}render();return}
 if(id==="dkFind"){toast("Leyendo QR…");const q=await dkDecodeFile(f).catch(()=>null);if(!q){toast("No se ha podido leer el QR.");return}
  const hit=DK.recs.find(r=>r.qrUrl&&(r.qrUrl===q||q.includes(r.qrUrl)||r.qrUrl.includes(q)));if(hit){toast("Documento encontrado");dkSheet(hit.id)}else{DK.q=q;render();toast("Ningún DeCA tiene ese QR.")}return}
 if(id==="dkAssoc"){const r=DK.recs.find(x=>x.id===DK.open);if(r)dkAssoc(r,f)}

 return "En el ordenador: haz clic en el candado o el icono de ajustes a la izquierda de la dirección → Micrófono → Permitir. Si Windows lo bloquea: Configuración → Privacidad y seguridad → Micrófono → activa el acceso para tu navegador.";}
function micSheet(state){return new Promise(res=>{
 const d=document.createElement("div");d.className="msheet-bg";d.innerHTML=`<div class="msheet card" role="dialog" aria-modal="true" aria-labelledby="msT">
  <div class="mic-ic">${ic("mic")}</div><h2 id="msT">${state==="denied"?"El micrófono está bloqueado":"Permiso de micrófono"}</h2>

   <p class="note">No elijas «Solo esta vez»: entonces lo pedirá cada vez que abras la app. Si la abres con doble clic en el archivo, el navegador nunca recuerda el permiso: ábrela desde su dirección web.</p>`}
  <div class="msh-b">${state==="denied"?`<button type="button" class="btn" data-ms="0">Entendido</button>`:`<button type="button" class="btn ghost" data-ms="0">Ahora no</button><button type="button" class="btn" data-ms="1">${ic("mic")}Continuar</button>`}</div></div>`;

async function vOnStart(){

  try{vStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){vShow(e&&e.name==="NotFoundError"?"No se encuentra ningún micrófono.":"Sin permiso para el micrófono. Permítelo en el navegador (elige «Permitir siempre»). En la vista de claude.ai no está disponible: usa la versión publicada en Netlify.","err");vStop(true);return}

function listen(){
 if(!vOn||vListening)return;
 const now=Date.now();vRestarts=vRestarts.filter(t=>now-t<60000);vRestarts.push(now);
 if(vRestarts.length>(window.__lgxNative?40:8)){vShow("El navegador corta el micrófono continuamente. Voz desactivada: vuelve a pulsar el botón.","err");vStop(true);return}
 rec=new SR();rec.lang="es-ES";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
 vErr="";vDone=new Set();
 rec.onresult=e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
   if(vTalk||Date.now()<vMuteUntil)continue; /* ignora lo que el propio asistente dice */
   if(!r.isFinal){vShow(r[0].transcript,"hear");continue}
   const key=i+"|"+r[0].transcript.trim().toLowerCase();if(vDone.has(key))continue;vDone.add(key);
   vNetFails=0;vPend=[];let ok=false;for(let a=0;a<r.length&&!ok;a++)ok=vCmd(r[a].transcript);
   vShow(ok?"✓ "+r[0].transcript.trim():"No entendí «"+r[0].transcript.trim()+"». Toca ? para ver qué decir.",ok?"ok":"no");
   const t=ok?vPend.join(". "):"No te he entendido";vPend=[];if(t&&vTts())speakNow(t,()=>{vMuteUntil=Date.now()+400})}};
 rec.onerror=e=>{vErr=e.error;
  if(e.error==="not-allowed"||e.error==="service-not-allowed"){vShow("Sin permiso para el micrófono. Permítelo en el navegador (elige «Permitir siempre»). En la vista de claude.ai no está disponible: usa la versión publicada en Netlify.","err");vStop(true)}
  else if(e.error==="audio-capture"){vShow("No se encuentra ningún micrófono.","err");vStop(true)}
  else if(e.error==="network"){vNetFails++;vShow(vNetFails>=3?"Sin conexión: el reconocimiento de voz necesita internet. Voz desactivada.":"Sin conexión, reintentando…","err");if(vNetFails>=3)vStop(true)}};
 rec.onend=()=>{vListening=false;if(vOn)setTimeout(listen,vErr==="network"?2000:300)};
 try{rec.start();vListening=true}catch(e){vListening=false}
}

 if(e.target.closest("#save")){save();return}
 if(e.target.closest("#discard")){draft=null;dirty=false;render();toast("Cambios descartados");return}
 if(e.target.closest("#lockbtn")){unlocked=false;ss.del("lgx-unlock-once");draft=null;dirty=false;location.hash="#inicio";return}
 if(e.target.closest("#setpin")){const c0=$("#np0").value.trim(),a=$("#np1").value.trim(),b=$("#np2").value.trim();
  if(!c0){toast("Introduce la clave actual");$("#np0").focus();return}
  if((await sha("lopegar:"+c0))!==S.pinHash){toast("La clave actual no es correcta");$("#np0").value="";$("#np0").focus();return}
  if(!/^\d{4,8}$/.test(a)){toast("La clave debe tener entre 4 y 8 números");return}
  if(a!==b){toast("Las dos claves no coinciden");return}
  draft.pinHash=await sha("lopegar:"+a);markDirty();$("#np0").value="";$("#np1").value="";$("#np2").value="";toast("Clave preparada. Pulsa «Guardar y publicar».");return}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="pVolR"){vol=+t.value;muted=false;applyVol();return}
 if(t.id==="q"){fq=t.value;drawStations();return}
 if(t.id==="rq"){rq=t.value;drawRad();return}
 if(t.id==="tq"){tq=t.value;drawTipsa();return}
 if(t.dataset&&t.dataset.p){setPath(draft,t.dataset.p,t.value);markDirty();return}
 if(t.id==="pinin"){const v=t.value.replace(/\D/g,"");t.value="";for(const ch of v)pinKey(ch);return}
});
document.addEventListener("change",e=>{if(e.target.id==="vOptTts")ls.set("lgx-vtts",e.target.checked?"1":"0");if(e.target.id==="vOptCont")ls.set("lgx-vcont",e.target.checked?"1":"0")});
document.addEventListener("keydown",e=>{
 if(view==="ajustes"&&!unlocked&&!e.target.matches("input:not(#pinin),textarea")){
  if(/^\d$/.test(e.key)){e.preventDefault();pinKey(e.key)}else if(e.key==="Backspace"){e.preventDefault();pinKey("del")}else if(e.key==="Enter"){e.preventDefault();pinKey("ok")}
 }
});
window.addEventListener("beforeunload",e=>{if(dirty&&view==="ajustes"){e.preventDefault()}});

if(ss.get("lgx-saved")==="1"){ss.del("lgx-saved");tab=ss.get("lgx-tab")||"general";setTimeout(()=>toast("Cambios publicados"),300)}
/* ---------- App instalable (solo en la web publicada, no en claude.ai) ---------- */
let instEv=null;
const hosted=location.protocol==="https:"&&!/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
if(hosted){
 [["link",{rel:"manifest",href:"manifest.webmanifest"}],["link",{rel:"apple-touch-icon",href:"icon-192.png"}],["meta",{name:"theme-color",content:"#25272b"}],["meta",{name:"apple-mobile-web-app-capable",content:"yes"}],["meta",{name:"mobile-web-app-capable",content:"yes"}],["meta",{name:"apple-mobile-web-app-status-bar-style",content:"black-translucent"}],["meta",{name:"apple-mobile-web-app-title",content:"LOPEGAR EXPRESS"}]].forEach(([t,a])=>{if(document.querySelector(a.rel?`link[rel="${a.rel}"]`:`meta[name="${a.name}"]`))return;const el=document.createElement(t);for(const k in a)el.setAttribute(k,a[k]);document.head.appendChild(el)});
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEv=e;if(view==="inicio")render()});
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(navigator.userAgent);
const isStandalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
function installHint(){
 if(!hosted||isStandalone||ls.get("lgx-hint-off")==="1")return "";
 if(isIOS)return `<div class="card install ios"><div><b>Instala la app en tu iPhone</b><span>En Safari, toca <svg class="i shr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg> <b class="in">Compartir</b> y después <b class="in">Añadir a pantalla de inicio</b>. Se abrirá a pantalla completa, como una app.</span></div><button type="button" class="btn ghost sm" id="hintOff">Ocultar</button></div>`;
 if(isAndroid)return `<div class="card install"><div><b>Instala la app en tu Android</b><span>En Chrome, toca el menú <b class="in">⋮</b> y después <b class="in">Instalar aplicación</b> (o «Añadir a pantalla de inicio»).</span></div><button type="button" class="btn ghost sm" id="hintOff">Ocultar</button></div>`;
 return "";
}
async function doInstall(){if(!instEv)return;instEv.prompt();let o="";try{o=(await instEv.userChoice).outcome}catch(e){}instEv=null;render();return o}
/* ---------- Instalar al abrir: desde el archivo HTML o desde la web ---------- */
const SHR='<svg class="i shr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
function instSheet(html,onAct){
 document.querySelectorAll(".msheet-bg.inst").forEach(x=>x.remove());
 const d=document.createElement("div");d.className="msheet-bg inst";
 d.innerHTML=`<div class="msheet card" role="dialog" aria-modal="true" aria-labelledby="isT"><div class="logo" style="width:64px;height:64px">${S.logo?`<img src="${S.logo}" alt="">`:""}</div>${html}</div>`;
 document.body.appendChild(d);const f=d.querySelector(".btn:last-child");f&&f.focus();
 d.addEventListener("click",e=>{const b=e.target.closest("[data-is]");if(!b&&e.target!==d)return;
  const a=b?b.dataset.is:"0";if(a==="0"||a==="never"){if(a==="never")ls.set("lgx-inst-off","1");d.remove();return}onAct&&onAct(a,d)});
 return d;
}
function instStepsHtml(){
 if(isIOS)return `<ol class="steps"><li><span>Abre esta página en <b>Safari</b>.</span></li><li><span>Toca ${SHR} <b>Compartir</b> (abajo en el centro).</span></li><li><span>Baja y toca <b>Añadir a pantalla de inicio</b> y después <b>Añadir</b>.</span></li></ol>`;
 if(isAndroid)return `<ol class="steps"><li><span>Abre esta página en <b>Chrome</b>.</span></li><li><span>Toca el menú <b>⋮</b> (arriba a la derecha).</span></li><li><span>Toca <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</span></li></ol>`;
 return `<ol class="steps"><li><span>Abre esta página en <b>Chrome</b> o <b>Edge</b>.</span></li><li><span>Pulsa el icono de instalar <b>⊕</b> a la derecha de la barra de direcciones.</span></li><li><span>Pulsa <b>Instalar</b>. En Safari del Mac: menú Archivo → <b>Añadir al Dock</b>.</span></li></ol>`;
}
function webInstallSheet(){
 const body=()=>instEv
  ?`<h2 id="isT">Instalar ${esc(S.marca)}</h2><p>Pulsa <b>Instalar</b> y confirma. Tendrás el icono en tu ${isAndroid||isIOS?"móvil":"ordenador"}, se abrirá a pantalla completa y recordará los permisos de micrófono y GPS.</p>
    <div class="msh-b"><button type="button" class="btn ghost" data-is="never">No volver a preguntar</button><button type="button" class="btn ghost" data-is="0">Ahora no</button><button type="button" class="btn" data-is="go">${ic("up")}Instalar</button></div>`
  :`<h2 id="isT">Instalar ${esc(S.marca)}</h2><p>Así queda instalada en tu ${isAndroid||isIOS?"móvil":"ordenador"} con su icono, como una app:</p>${instStepsHtml()}
    <div class="msh-b"><button type="button" class="btn ghost" data-is="never">No volver a preguntar</button><button type="button" class="btn" data-is="0">Entendido</button></div>`;
 const d=instSheet(body(),async a=>{if(a==="go"){d.remove();if(await doInstall()==="accepted")toast("Lopegar instalada: búscala en tu pantalla de inicio o escritorio")}});
 if(!instEv){let n=0;const t=setInterval(()=>{n++;if(instEv&&document.body.contains(d)){clearInterval(t);d.querySelector(".msheet").innerHTML=d.querySelector(".logo").outerHTML+body()}if(n>12||!document.body.contains(d))clearInterval(t)},250)}
}
async function fileInstallSheet(){
 const u=(S.appUrl||"").trim();
 if(!u){return}
 const dest=u+(u.includes("?")?"&":"?")+"instalar=1";
 const d=instSheet(`<h2 id="isT">Instalar ${esc(S.marca)} en este dispositivo</h2>
  <p>Has abierto la app desde un archivo. Para instalarla con su icono y todas las funciones (radio, voz, GPS de radares y clima en directo), pulsa <b>Instalar</b>: se abrirá la versión publicada y solo tendrás que confirmar.</p>
  <p class="note" id="isNet">Comprobando la conexión con ${esc(u.replace(/^https?:\/\//,"").replace(/\/$/,""))}…</p>
  <div class="msh-b"><button type="button" class="btn ghost" data-is="never">No volver a preguntar</button><button type="button" class="btn ghost" data-is="0">Ahora no</button><button type="button" class="btn" data-is="go">${ic("up")}Instalar</button></div>`,
  a=>{if(a==="go"){ls.set("lgx-inst-file","1");location.href=dest}});
 const net=d.querySelector("#isNet");
 try{const c=new AbortController();setTimeout(()=>c.abort(),6000);await fetch(u,{mode:"no-cors",cache:"no-store",signal:c.signal});net.textContent="Necesitas internet solo para instalarla. Después se abre desde su icono."}
 catch(e){net.innerHTML=`<b style="color:var(--sos)">No se puede llegar a ${esc(u)}.</b> Revisa que tienes internet. Si sigue fallando, la versión para instalar aún no está publicada en esa dirección: cámbiala en Ajustes → General.`}
}
(function autoInstall(){
 if(window.__lgxNative||isStandalone)return;
 const q=new URLSearchParams(location.search).get("instalar")==="1";
 if(location.protocol==="file:"){if(ls.get("lgx-inst-file")!=="1"&&ls.get("lgx-inst-off")!=="1"&&ss.get("lgx-inst-ses")!=="1"){ss.set("lgx-inst-ses","1");setTimeout(fileInstallSheet,400)}return}
 if(!hosted)return;
 if(q){try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}}
 if(q||(ls.get("lgx-inst-off")!=="1"&&ss.get("lgx-inst-web")!=="1")){ss.set("lgx-inst-web","1");setTimeout(webInstallSheet,q?300:1500)}
})();
/* Actualización automática del mapa de Google cada 10 minutos */
setInterval(()=>{gmAt=Date.now();if(view==="gmaps")render()},600000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(Date.now()-gmAt>600000){gmAt=Date.now();if(view==="gmaps")render()}});
route();
})();
</script>
</body>
</html>
